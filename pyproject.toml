[project]
name = "fakenews"
version = "0.1.0"
description = "Fake news detection on FakeNewsCorpus with honest, leakage-aware evaluation and cross-dataset tests on LIAR."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nicklas" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
transformer = [
    "torch>=2.4",
    "transformers>=4.44",
]
demo = [
    "gradio>=4.40",
]

[project.scripts]
fakenews = "fakenews.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fakenews"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
